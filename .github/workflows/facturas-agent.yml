name: Facturas Agent Sync

on:
  schedule:
    - cron: '0 7 * * *'  # Todos los días a las 08:00 AM (UTC-3)
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  sync-facturas:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Run Facturas Agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          attempt=1
          while [ "$attempt" -le 2 ]; do
            echo "▶️ Intento $attempt de 2"
            if python -u agent_facturas_gmail_github.py; then
              echo "✅ El agente finalizó correctamente."
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 2 ]; then
              echo "❌ El agente falló también en el segundo intento."
              exit "$status"
            fi

            echo "⚠️ El agente falló (código $status). Reintentando en una hora..."
            sleep 3600
            attempt=$((attempt + 1))
          done
