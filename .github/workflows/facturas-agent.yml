name: Facturas Agent Sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  parse-bills:
    name: Parse ${{ matrix.provider }} bills
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        provider:
          - personal
          - camuzzi
          - edes
          - absa
          - arca
          - movistar
          - brubank
          - municipalidad
          - bvnet
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Parse provider bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p parsed-bills
          python -u agent_facturas_gmail_github.py \
            --provider "${{ matrix.provider }}" \
            --output "parsed-bills/${{ matrix.provider }}.json" \
            --no-publish

      - name: Upload parser result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bills-${{ matrix.provider }}
          path: parsed-bills/${{ matrix.provider }}.json
          if-no-files-found: warn
          retention-days: 1

  merge-and-publish:
    name: Merge and publish bills
    needs: parse-bills
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download completed parser results
        if: always()
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: bills-*
          path: parsed-bills
          merge-multiple: true

      - name: Merge and publish available bills
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python -u merge_bills.py
