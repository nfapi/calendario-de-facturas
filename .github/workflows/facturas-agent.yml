name: Facturas Agent Sync

on:
  schedule:
    - cron: '0 7 * * *'  # Todos los días a las 08:00 AM (UTC-3)
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  sync-facturas:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Process Personal bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -u agent_facturas_gmail_github.py --provider personal

      - name: Process Camuzzi gas bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -u agent_facturas_gmail_github.py --provider camuzzi

      - name: Process EDES bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -u agent_facturas_gmail_github.py --provider edes

      - name: Process ABSA bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -u agent_facturas_gmail_github.py --provider absa

      - name: Process ARCA bills
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python -u agent_facturas_gmail_github.py --provider arca
